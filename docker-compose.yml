version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: epsilint-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount custom rules directory — add your own YAML/JSON rules here
      - ./custom-rules:/app/rules/custom
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: epsilint-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
